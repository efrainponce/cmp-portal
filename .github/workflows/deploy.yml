name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npx tsc --noEmit` a secas NO revisaba nada: tsconfig.json es solo un
      # archivo solución ("files": [] + references), así que ese comando salía 0
      # siempre y el worker encima ni siquiera está referenciado. `npm run
      # typecheck` corre las tres configs de verdad (app + node vía tsc -b, y
      # worker aparte).
      - run: npm run typecheck

      # Corre ANTES del deploy: un push a main sale a producción, y los tests
      # cubren el write path a Monday (canon/echo + shapes de columna) y la
      # whitelist de visibilidad — cosas que el typecheck no puede atrapar.
      - run: npm test

      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
